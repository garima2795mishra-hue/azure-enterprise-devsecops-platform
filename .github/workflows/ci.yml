
name: DevSecOps CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  maven-build:
    name: Maven Build (Reusable)
    uses: ./.github/workflows/reusable-maven.yml
    with:
      java-version: '21'
      working-directory: 'java-app'

  gradle-build:
    name: Gradle Build
    runs-on: ubuntu-latest
